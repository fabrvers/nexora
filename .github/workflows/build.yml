# Compile l'installeur Windows sans rien installer sur votre poste.
#
# Deposez ce projet dans un depot GitHub : a chaque envoi sur la branche
# principale, l'installeur est compile et depose dans les artefacts du run.
# Un tag v1.0.0 publie en plus une release avec le .exe attache.

name: Compiler l'installeur Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:      # bouton « Run workflow » dans l'onglet Actions

jobs:
  build:
    runs-on: windows-latest
    # Necessaire pour qu'electron-builder puisse creer la publication
    # GitHub et y deposer l'installeur ainsi que latest.yml.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 : les tests s'appuient sur --experimental-strip-types.
          # Pas d'option « cache », qui exigerait un package-lock.json.
          node-version: 22

      - name: Installer les dépendances
        # npm install et non npm ci : le projet n'embarque pas de
        # package-lock.json, que npm ci exige.
        run: npm install

      - name: Vérifier la classification, les périodes et le stockage
        run: npm test

      - name: Compiler l'installeur
        # Sur un tag, electron-builder publie lui-meme l'installeur ET le
        # fichier latest.yml dont l'application a besoin pour detecter les
        # nouvelles versions. Sans ce fichier, la mise a jour automatique
        # ne peut pas fonctionner.
        run: npm run package -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'installeur en artefact
        uses: actions/upload-artifact@v4
        with:
          name: Passerelle-Pennylane-Setup
          path: release/*.exe
          retention-days: 30

